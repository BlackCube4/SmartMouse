move:
  name: Move Mouse
  description: Send relative mouse movement.
  target:
    device:
      integration: smartmouse
  fields:
    x:
      name: X Axis
      description: Relative movement on the X axis.
      required: true
      selector:
        number:
          mode: box
    y:
      name: Y Axis
      description: Relative movement on the Y axis.
      required: true
      selector:
        number:
          mode: box

move_absolute:
  name: Move Mouse Absolute
  description: Move mouse to an absolute coordinate.
  target:
    device:
      integration: smartmouse
  fields:
    x:
      name: X Coordinate
      required: true
      selector:
        number:
          min: 0
          max: 32767
          mode: box
    y:
      name: Y Coordinate
      required: true
      selector:
        number:
          min: 0
          max: 32767
          mode: box

button:
  name: Mouse Button
  description: Send mouse button press, release, or click.
  target:
    device:
      integration: smartmouse
  fields:
    button:
      name: Button
      default: left
      selector:
        select:
          options:
            - left
            - right
            - middle
    mode:
      name: Mode
      default: click
      selector:
        select:
          options:
            - click
            - down
            - up

scroll_wheel:
  name: Scroll Wheel
  description: Send low-res scroll wheel movement.
  target:
    device:
      integration: smartmouse
  fields:
    delta:
      name: Delta
      description: Scroll amount.
      required: true
      selector:
        number:
          mode: box

touchpad_scroll:
  name: Touchpad Scroll
  description: >-
    Move the two scroll fingers by (x, y). (0, 0) holds them in place (keepalive).
    Set end=true to lift the fingers and finish the gesture.
  target:
    device:
      integration: smartmouse
  fields:
    x:
      name: X Axis
      default: 0
      selector:
        number:
          mode: box
    y:
      name: Y Axis
      default: 0
      selector:
        number:
          mode: box
    end:
      name: End Gesture
      description: Lift the scroll fingers (ignores x/y).
      default: false
      selector:
        boolean:

key_control:
  name: Key Control
  description: Send a key press, release, or send for a single HID keycode.
  target:
    device:
      integration: smartmouse
  fields:
    keycode:
      name: Keycode
      description: The HID keycode to send (0-255).
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box
    mode:
      name: Mode
      default: send
      selector:
        select:
          options:
            - press
            - release
            - send

media_control:
  name: Media Control
  description: Send media key press, release, or send.
  target:
    device:
      integration: smartmouse
  fields:
    code:
      name: Media Code
      description: The HID consumer control code.
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    mode:
      name: Mode
      default: send
      selector:
        select:
          options:
            - press
            - release
            - send

text_send:
  name: Send Text
  description: Send a string of text via the keyboard.
  target:
    device:
      integration: smartmouse
  fields:
    text:
      name: Text
      description: The text string to type.
      required: true
      selector:
        text:

reset:
  name: Reset SmartMouse
  description: Release all modifiers and trigger ESP hardware reset.
  target:
    device:
      integration: smartmouse

pc_power_toggle:
  name: PC Power Toggle
  description: Pulse the PC power button.
  target:
    device:
      integration: smartmouse

pc_hard_power_off:
  name: PC Hard Power Off
  description: Hold the PC power button for a hard shutdown.
  target:
    device:
      integration: smartmouse

pc_power_on:
  name: PC Power On
  description: Turn the PC on if it's currently off.
  target:
    device:
      integration: smartmouse

pc_power_off:
  name: PC Power Off
  description: Turn the PC off if it's currently on.
  target:
    device:
      integration: smartmouse